[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snitchwatt"
version = "0.1.0"
description = "A from-scratch TVLA (Test Vector Leakage Assessment) leakage-auditing toolkit."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["snitchwatt*"]
